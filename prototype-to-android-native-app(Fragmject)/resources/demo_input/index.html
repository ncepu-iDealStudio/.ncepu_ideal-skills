<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>技能互换</title>
  <style>
    :root { --primary: #2B6DE5; }
    body { margin: 0; background: #F7F8FA; font-family: -apple-system, sans-serif; }
    .page { padding: 16px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .item-card { display: flex; background: #fff; border-radius: 12px; padding: 12px; }
    .avatar-img { width: 72px; height: 72px; border-radius: 8px; background: #E0E3E8; }
    .item-title { font-size: 17px; font-weight: 600; }
    .item-desc { font-size: 12px; color: #5F6368; }
    .tag { color: var(--primary); font-size: 11px; }
    .price { color: var(--primary); font-weight: 600; }
    .load-more { text-align: center; color: #5F6368; padding: 16px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header-bar">
      <h1>技能广场</h1>
      <span class="user-info">我的</span>
    </div>

    <div class="list">
      <div class="item-card" onclick="goDetail(1)">
        <img class="avatar-img" src="https://picsum.photos/seed/1/200" alt="封面" />
        <div>
          <div class="item-title">可以教你吉他入门到弹唱，学期内包会</div>
          <div class="item-desc">可线上或线下，时间灵活，欢迎私聊细聊。</div>
          <div class="tag">线下 · 周末</div>
          <div class="price">免费</div>
        </div>
      </div>

      <div class="item-card" onclick="goDetail(2)">
        <img class="avatar-img" src="https://picsum.photos/seed/2/200" alt="封面" />
        <div>
          <div class="item-title">Canva 海报设计 / 公众号首图一对一辅导</div>
          <div class="item-desc">含源文件，出图快。</div>
          <div class="tag">线上</div>
          <div class="price">¥35.00</div>
        </div>
      </div>
    </div>

    <div class="load-more">上拉加载更多</div>
  </div>
</body>
</html>
