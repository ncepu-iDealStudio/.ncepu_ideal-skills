version: "3"
services:
  study_flask_api:
    privileged: true
    stdin_open: true
    tty: true
    build: .
    image: study_flask_api
#    container_name: project_layout
    restart: always
    volumes:
      - /docker/project_layout/configs:/apps/configs
      - /docker/project_layout/logs:/apps/logs
    ports:
      - "8000:8000"
    command:
      - /apps/golang_app