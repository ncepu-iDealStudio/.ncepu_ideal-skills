<!DOCTYPE html>

<head>

<meta name="description" content="通过邮件或留言联系作者。">

<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<header class="site-header" data-component="site-header">
  <div class="wrap">
    <div class="brand"><a href="index.html" style="text-decoration:none">砚田笔记</a></div>
    <nav class="nav" aria-label="主导航">
      <ul><li><a href="index.html">首页</a></li><li><a href="list.html">文章</a></li><li><a href="about.html">关于</a></li><li><a href="contact.html" aria-current="page">联系</a></li></ul>
    </nav>
    <details class="menu">
      <summary>菜单</summary>
      <ul><li><a href="index.html">首页</a></li><li><a href="list.html">文章</a></li><li><a href="about.html">关于</a></li><li><a href="contact.html">联系</a></li></ul>
    </details>
  </div>
</header>
<main>
<div class="wrap hero">
  <h1>联系</h1>
  <p class="lead">看到错别字、或者有想聊的话题，都可以写信。</p>
</div>
<section class="block"><div class="wrap">
  <h2>留言</h2>
  <form class="contact" action="#" method="post">
    <label for="name">称呼</label>
    <input id="name" name="name" type="text" required autocomplete="name">
    <label for="email">邮箱</label>
    <input id="email" name="email" type="email" required autocomplete="email">
    <label for="msg">想说的话</label>
    <textarea id="msg" name="msg" rows="5" required></textarea>
    <p style="margin-top:16px"><button class="btn" type="submit">发送</button></p>
  </form>
  <p class="meta">本页为静态原型，表单不会真正提交。</p>
</div></section>
</main>
<footer class="site-footer" data-component="site-footer">
  <div class="wrap">
    <span>砚田笔记 · 静态站点原型（演示用样例内容）</span>
    <span>设计包 swiss-minimal · 可直接双击浏览</span>
  </div>
</footer>

</body>
</html>
