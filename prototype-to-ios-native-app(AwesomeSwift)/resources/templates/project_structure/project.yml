# XcodeGen 工程声明：改工程配置请改这里，然后执行 `xcodegen generate`
# 文档：https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: {{project_name}}

options:
  bundleIdPrefix: {{bundle_id_prefix}}
  deploymentTarget:
    iOS: "{{ios_min}}"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.38.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"
    # 模板走 Swift 5 语言模式；迁移 Swift 6 严格并发时改为 complete 并逐个修隔离
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    # 真机运行请填入你的 Apple 开发者 Team ID
    # DEVELOPMENT_TEAM: XXXXXXXXXX

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: 5.9.1
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 7.12.0

targets:
  {{project_name}}:
    type: application
    platform: iOS
    sources:
      - path: {{project_name}}
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: {{project_name}}
        PRODUCT_BUNDLE_IDENTIFIER: {{bundle_id}}
        INFOPLIST_FILE: {{project_name}}/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    # xcconfig 用 configFiles 声明（不是 settings.configs，那里只能覆盖 build setting）
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    dependencies:
      - package: Alamofire
      - package: Kingfisher

  {{project_name}}Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: {{bundle_id}}.tests
    dependencies:
      - target: {{project_name}}

schemes:
  {{project_name}}:
    build:
      targets:
        {{project_name}}: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - {{project_name}}Tests
    archive:
      config: Release
