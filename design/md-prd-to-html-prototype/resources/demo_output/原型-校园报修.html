<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园报修 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .view { display: none; }
    .view.active { display: block; }
    .modal { display: none; }
    .modal.open { display: flex; }
    #toast { display: none; }
    #toast.show { display: block; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <div class="flex min-h-screen">
    <aside class="w-56 shrink-0 bg-slate-800 text-white p-4">
      <p class="text-sm text-slate-300 mb-4">校园报修</p>
      <nav class="flex flex-col gap-2" aria-label="页面">
        <button type="button" class="text-left rounded px-3 py-2 bg-slate-700" data-view="list">报修列表</button>
      </nav>
    </aside>
    <main class="flex-1 p-6">
      <section id="list" class="view active">
        <div class="flex items-center justify-between mb-4">
          <h1 class="text-xl font-semibold">报修列表</h1>
          <button type="button" id="open-create" class="rounded bg-slate-800 text-white px-3 py-2">新增报修</button>
        </div>
        <form id="filter-form" class="flex flex-wrap gap-2 mb-4 items-center">
          <label>状态
            <select id="filter-status" class="border rounded px-2 py-1 ml-2">
              <option value="">全部</option>
              <option>待处理</option>
              <option>处理中</option>
              <option>已完成</option>
            </select>
          </label>
          <button type="submit" class="border rounded px-3 py-1">查询</button>
          <button type="button" id="filter-reset" class="border rounded px-3 py-1">重置</button>
        </form>
        <table class="w-full bg-white text-left">
          <thead>
            <tr>
              <th class="border-b p-2">单号</th>
              <th class="border-b p-2">地点</th>
              <th class="border-b p-2">问题描述</th>
              <th class="border-b p-2">状态</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>
  </div>

  <div id="modal" class="modal fixed inset-0 bg-black/40 items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <form id="create-form" class="bg-white rounded p-4 w-full max-w-md">
      <h2 id="modal-title" class="text-lg mb-3">新增报修</h2>
      <label class="block mb-3">地点
        <input id="place" required class="mt-1 w-full border rounded px-2 py-1">
      </label>
      <label class="block mb-3">问题描述
        <input id="detail" required class="mt-1 w-full border rounded px-2 py-1">
      </label>
      <div class="flex justify-end gap-2">
        <button type="button" id="modal-close" class="border rounded px-3 py-1">取消</button>
        <button type="submit" class="rounded bg-slate-800 text-white px-3 py-1">提交</button>
      </div>
    </form>
  </div>
  <p id="toast" class="fixed bottom-4 right-4 bg-slate-800 text-white rounded px-3 py-2" role="status"></p>

  <script>
    const MOCK_ROWS = [
      { no: "BX-1001", place: "一号楼 203", detail: "灯管不亮", status: "待处理" },
      { no: "BX-1002", place: "图书馆门口", detail: "门锁松动", status: "处理中" },
      { no: "BX-1003", place: "食堂二楼", detail: "水龙头漏水", status: "已完成" }
    ];
    let nextNo = 1004;

    const rowsEl = document.querySelector("#rows");
    const modal = document.querySelector("#modal");
    const toast = document.querySelector("#toast");

    function render(list) {
      rowsEl.innerHTML = list.map((row) =>
        `<tr><td class="border-b p-2">${row.no}</td><td class="border-b p-2">${row.place}</td><td class="border-b p-2">${row.detail}</td><td class="border-b p-2">${row.status}</td></tr>`
      ).join("");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    }

    document.querySelector("#open-create").addEventListener("click", () => modal.classList.add("open"));
    document.querySelector("#modal-close").addEventListener("click", () => modal.classList.remove("open"));

    document.querySelector("#filter-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const status = document.querySelector("#filter-status").value;
      render(MOCK_ROWS.filter((row) => !status || row.status === status));
    });
    document.querySelector("#filter-reset").addEventListener("click", () => {
      document.querySelector("#filter-form").reset();
      render(MOCK_ROWS);
    });

    document.querySelector("#create-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const place = document.querySelector("#place").value.trim();
      const detail = document.querySelector("#detail").value.trim();
      if (!place || !detail) return;
      MOCK_ROWS.unshift({ no: "BX-" + nextNo, place, detail, status: "待处理" });
      nextNo += 1;
      event.target.reset();
      modal.classList.remove("open");
      document.querySelector("#filter-form").reset();
      render(MOCK_ROWS);
      showToast("提交成功");
    });

    render(MOCK_ROWS);
  </script>
</body>
</html>
