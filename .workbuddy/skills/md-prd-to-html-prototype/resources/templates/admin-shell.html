<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系统名称 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .view { display: none; }
    .view.active { display: block; }
    .modal { display: none; }
    .modal.open { display: flex; }
    #toast { display: none; }
    #toast.show { display: block; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <div class="flex min-h-screen">
    <aside class="w-56 shrink-0 bg-slate-800 text-white p-4">
      <p class="text-sm text-slate-300 mb-4">系统名称</p>
      <nav class="flex flex-col gap-2" aria-label="页面">
        <!-- NAV: 每个页面一个 button，data-view 对应视图 id -->
        <button type="button" class="text-left rounded px-3 py-2 bg-slate-700" data-view="list">列表示例</button>
      </nav>
    </aside>
    <main class="flex-1 p-6">
      <!-- VIEW: 每个页面一块 section.view -->
      <section id="list" class="view active">
        <div class="flex items-center justify-between mb-4">
          <h1 class="text-xl font-semibold">列表示例</h1>
          <button type="button" id="open-create" class="rounded bg-slate-800 text-white px-3 py-2">新增</button>
        </div>
        <form id="filter-form" class="flex gap-2 mb-4">
          <label>状态
            <select id="filter-status" class="border rounded px-2 py-1 ml-2">
              <option value="">全部</option>
              <option>待处理</option>
            </select>
          </label>
          <button type="submit" class="border rounded px-3 py-1">查询</button>
          <button type="button" id="filter-reset" class="border rounded px-3 py-1">重置</button>
        </form>
        <table class="w-full bg-white text-left">
          <thead>
            <tr>
              <th class="border-b p-2">字段甲</th>
              <th class="border-b p-2">状态</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>
  </div>

  <div id="modal" class="modal fixed inset-0 bg-black/40 items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <form id="create-form" class="bg-white rounded p-4 w-full max-w-md">
      <h2 id="modal-title" class="text-lg mb-3">新增</h2>
      <label class="block mb-3">字段甲
        <input id="field-a" required class="mt-1 w-full border rounded px-2 py-1">
      </label>
      <div class="flex justify-end gap-2">
        <button type="button" id="modal-close" class="border rounded px-3 py-1">取消</button>
        <button type="submit" class="rounded bg-slate-800 text-white px-3 py-1">提交</button>
      </div>
    </form>
  </div>
  <p id="toast" class="fixed bottom-4 right-4 bg-slate-800 text-white rounded px-3 py-2" role="status"></p>

  <script>
    const MOCK_ROWS = [
      { fieldA: "示例", status: "待处理" }
    ];

    const rowsEl = document.querySelector("#rows");
    const modal = document.querySelector("#modal");
    const toast = document.querySelector("#toast");

    function render(list) {
      rowsEl.innerHTML = list.map((row) =>
        `<tr><td class="border-b p-2">${row.fieldA}</td><td class="border-b p-2">${row.status}</td></tr>`
      ).join("");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    }

    document.querySelectorAll("[data-view]").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".view").forEach((view) => view.classList.remove("active"));
        document.querySelector("#" + button.dataset.view).classList.add("active");
      });
    });

    document.querySelector("#open-create").addEventListener("click", () => modal.classList.add("open"));
    document.querySelector("#modal-close").addEventListener("click", () => modal.classList.remove("open"));

    document.querySelector("#filter-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const status = document.querySelector("#filter-status").value;
      render(MOCK_ROWS.filter((row) => !status || row.status === status));
    });
    document.querySelector("#filter-reset").addEventListener("click", () => {
      document.querySelector("#filter-form").reset();
      render(MOCK_ROWS);
    });

    document.querySelector("#create-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const value = document.querySelector("#field-a").value.trim();
      if (!value) return;
      MOCK_ROWS.unshift({ fieldA: value, status: "待处理" });
      event.target.reset();
      modal.classList.remove("open");
      render(MOCK_ROWS);
      showToast("已提交");
    });

    render(MOCK_ROWS);
  </script>
</body>
</html>
